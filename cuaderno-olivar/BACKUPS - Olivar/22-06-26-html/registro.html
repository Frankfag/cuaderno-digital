<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro | Masía Centenaria</title>

  <link rel="stylesheet" href="../css/registro.css">

</head>

<body data-page="REGISTRO">

  <!-- ========================================= -->
  <!-- MENÚ HAMBURGUESA -->
  <!-- ========================================= -->

  <button
    id="btnMenu"
    class="boton-menu"
    type="button">

    ☰

  </button>

  <nav id="menuLateral" class="menu-lateral">

    <a href="index.html">Inicio</a>

    <a href="registro.html" class="activo">
      Registro
    </a>

    <a href="totales.html">Totales</a>

    <a href="control-olivas.html">
      Control Olivas
    </a>

    <a href="fitosanitario.html">
      Fitosanitario Olivar
    </a>

    <a href="../cuaderno-huerta/cuaderno-huerta.html">
      Cuaderno Huerta
    </a>

    <a href="mi-cuenta.html">
      👤 Mi cuenta
    </a>

    <a href="#" onclick="logout()">
      🚪 Salir
    </a>

  </nav>

  <!-- ========================================= -->
  <!-- CABECERA -->
  <!-- ========================================= -->

  <header class="header">

    <div class="header__marca">

      <img
        src="../img/logo1.png"
        alt="Logo"
        class="header__logo">

      <h1 class="header__titulo">
        MASÍA CENTENARIA
      </h1>

    </div>

    <nav class="nav">

      <a href="index.html">Inicio</a>

      <a href="registro.html" class="activo">
        Registro
      </a>

      <a href="totales.html">
        Totales
      </a>

      <a href="control-olivas.html">
        Control Olivas
      </a>

      <a href="fitosanitario.html">
        Fitosanitario Olivar
      </a>

    </nav>

    <div class="contenedor-salir-global">

      <button
        onclick="logout()"
        class="boton-salir-rojo">

        Cerrar sesión

      </button>

    </div>

  </header>

  <!-- ========================================= -->
  <!-- CONTENIDO -->
  <!-- ========================================= -->

  <main class="main-container">

    <!-- ===================================== -->
    <!-- CABECERA CAMPAÑA -->
    <!-- ===================================== -->

    <section class="cabecera">

      <div class="cabecera__texto">

        <h2 id="tituloCampaña">

          Registro de Pesajes

        </h2>

      </div>

      <div class="cabecera__control">

        <span class="label-top">

          CAMPAÑA ACTIVA

        </span>

        <select id="selectorCampaña">

        </select>

      </div>

    </section>

    <!-- ===================================== -->
    <!-- FORMULARIO -->
    <!-- ===================================== -->

    <section class="tarjeta-panel">

      <h3>Nuevo pesaje</h3>

      <form
        id="formRegistro"
        class="form-grid">

        <div class="campo">

          <label for="parada">
            Parada
          </label>

          <select id="parada" required>

            <option value="">
              Selecciona
            </option>

            <option>JOVE</option>
            <option>VIÑETA</option>
            <option>TIRAS</option>
            <option>GRANJA</option>
            <option>HUERTA</option>
            <option>CAMINO</option>
            <option>PEREMATA</option>
            <option>TIRAS MASIA</option>

          </select>

        </div>

        <div class="campo">

          <label for="kilos">

            Kilos

          </label>

          <input
            id="kilos"
            type="number"
            step="0.01"
            min="0"
            required>

        </div>

        <div class="campo">

          <label for="fecha">

            Fecha

          </label>

          <input
            id="fecha"
            type="date"
            required>

        </div>

        <div class="acciones-formulario">

          <button
            type="submit"
            class="boton">

            Guardar

          </button>

          <button
            type="button"
            id="btnImprimir"
            class="boton boton-imprimir">

            🖨️ Imprimir

          </button>

          <button
            type="button"
            id="btnExcel"
            class="boton boton-excel">

            📊 Excel

          </button>

        </div>

      </form>

    </section>

    <!-- ===================================== -->
    <!-- HISTÓRICO -->
    <!-- ===================================== -->

    <section class="tarjeta-panel">

      <h3>Histórico de pesajes</h3>

      <div class="tabla-contenedor">

        <table
          class="tabla-control"
          id="tablaPesajes">

          <thead>

            <tr>

              <th>Fecha</th>
              <th>Parada</th>
              <th>Kilos</th>
              <th>Acción</th>

            </tr>

          </thead>

          <tbody id="tablaBody">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- ========================================= -->
  <!-- SCRIPTS -->
  <!-- ========================================= -->

  <script src="../js/registro.js"></script>

  <script src="../js/acceso.js"></script>

</body>

</html>
