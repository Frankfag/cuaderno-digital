<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaderno Huerta | Abonado</title>
  <link rel="stylesheet" href="/cuaderno-huerta/css/huerta-abonos.css">

   <!-- ✅ CSS UNIFICADOS --> 
  <link rel="stylesheet" href="../../css-global/tarjetas-global.css">
  <link rel="stylesheet" href="../../css-global/formularios-global.css">
  <link rel="stylesheet" href="../../css-global/tablas-global.css">
  
</head>

<body>

<div class="contenedor-salir-global">

  <button
    onclick="logout()"
    class="boton-salir-rojo">

    Cerrar sesión

  </button>

</div>

  <header class="header">
    <div class="header__marca">
      <img src="/cuaderno-huerta/img/logo1.png" alt="Logo" class="header__logo">
      <h1 class="header__titulo">MASIA CENTENARIA</h1>
    </div>

    <nav class="nav-huerta">
  <a href="/cuaderno-olivar/html/index.html">Inicio Principal</a>    
  <a href="/cuaderno-huerta/html/huerta-dashboard.html">📊Panel Huerta</a>
  <a href="/cuaderno-huerta/html/huerta-riegos.html">🚿Regar</a>
  <a href="/cuaderno-huerta/html/cuaderno-huerta.html" >🌿 Huerta</a>
  <a href="/cuaderno-huerta/html/huerta-labores.html">📋Labores</a>
  <a href="/cuaderno-huerta/html/huerta-abonos.html" class="activo">🌿Abonado</a>
  <a href="/cuaderno-huerta/html/huerta-calendario.html">📋Calendario</a>
</nav>  
</header>

  <!-- Menú hamburguesa -->
  <button class="boton-menu" onclick="toggleMenu()">☰</button>

  <div id="menuLateral" class="menu-lateral">
  <a href="/cuaderno-olivar/html/index.html">Inicio Principal</a>    
  <a href="/cuaderno-huerta/html/huerta-dashboard.html">📊Panel Huerta</a>
  <a href="/cuaderno-huerta/html/huerta-riegos.html">🚿Regar</a>
  <a href="/cuaderno-huerta/html/cuaderno-huerta.html" >🌿 Huerta</a>
  <a href="cuaderno-huerta/html/huerta-labores.html">📋Labores</a>
  <a href="cuaderno-huerta/html/huerta-abonos.html" class="activo">🌿Abonado</a>
  <a href="cuaderno-huerta/html/huerta-calendario.html">📋Calendario</a>
  <a href="#" onclick="logout()">🚪 Salir</a>
  </div>
  
  <main class="main">

    <!-- FORMULARIO -->
    <section class="tarjeta">
      <h3>Nuevo abonado</h3>

      <form id="formAbono" class="formulario-grid">

        <div class="campo">
          <label for="fechaAbono">Fecha</label>
          <input type="date" id="fechaAbono" required>
        </div>

        <div class="campo">
  <label for="parcelaAbono">Parcela</label>

  <select id="parcelaAbono" required>
    <option value="">-- Selecciona parcela --</option>

    <option value="Parcela 1">Parcela 1</option>
    <option value="Parcela 2">Parcela 2</option>
    <option value="Parcela 3">Parcela 3</option>
    <option value="Parcela 4">Parcela 4</option>
    <option value="Parcela 5">Parcela 5</option>
    <option value="Parcela 6">Parcela 6</option>
  </select>

</div>

        <div class="campo">
          <label for="productoAbono">Producto</label>
          <input type="text" id="productoAbono" required>
        </div>

        <div class="campo">
          <label for="cantidadAbono">Cantidad</label>
          <input type="text" id="cantidadAbono" placeholder="Ej. 2 kg">
        </div>

        <div class="campo campo--doble">
          <label for="notasAbono">Notas</label>
          <textarea id="notasAbono"></textarea>
        </div>

        <div class="acciones-formulario">
          <button type="submit" class="boton">Guardar abonado</button>
        </div>

      </form>
    </section>

    <!-- HISTÓRICO -->
    <section class="tarjeta">
      <h3>Histórico de abonado</h3>

      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Parcela</th>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Notas</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaAbonos"></tbody>
        </table>
      </div>
    </section>

  </main>
<script src="/cuaderno-olivar/js/acceso.js"></script>
<script src="../js/huerta-abonos.js"></script>
  
</body>
</html>
