<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso | Masía Centenaria</title>

  <link rel="stylesheet" href="../css/login.css">

</head>

<body class="login-body">

  <main class="login-container">

    <form
      id="formLogin"
      class="login-card">

      <div class="login-marca">

        <img
          src="../img/logo1.png"
          alt="Logo"
          class="login-logo">

        <h1 class="login-titulo">

          MASÍA CENTENARIA

        </h1>

      </div>

      <h2 class="login-subtitulo">

        Acceso al Cuaderno Digital Agrícola

      </h2>

      <div class="campo">

        <label for="user">

          Usuario

        </label>

        <input
          type="text"
          id="user"
          autocomplete="username"
          required>

      </div>

      <div class="campo">

        <label for="pass">

          Contraseña

        </label>

        <div class="campo-password">

          <input
            type="password"
            id="pass"
            autocomplete="current-password"
            required>

          <button
            type="button"
            id="btnMostrarPassword"
            class="btn-ver-password">

            👁️

          </button>

        </div>

      </div>

      <button
        type="submit"
        id="btnLogin"
        class="boton-login">

        Entrar

      </button>

      <p
        id="error"
        class="login-error">

      </p>

    </form>

  </main>

  <script src="../js/acceso.js"></script>

</body>

</html>
